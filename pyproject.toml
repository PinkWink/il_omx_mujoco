[project]
name = "il-omx"
version = "0.1.0"
description = "Imitation learning with an OMX leader arm and a simulated OMX follower in MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.15.0",
    "numpy",
    "pillow",
    "imageio[ffmpeg]",
    "lerobot[dynamixel,dataset,training]==0.6.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["il_omx"]
